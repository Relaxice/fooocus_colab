/* ── HEADER ── */

}

/* ── MAIN ── */

}
.ftree::-webkit-scrollbar{width:6px}
.ftree::-webkit-scrollbar-track{background:transparent}
.ftree::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}

.ti{
  display:flex;align-items:center;gap:4px;
  padding:3px 8px 3px 4px;cursor:pointer;border-radius:4px;margin:0 4px 1px;
  transition:background .1s;position:relative;

}
.ti:hover{background:var(--bg-h)}
.ti.act{background:var(--bg-a);color:var(--acc)}
.ti .arr{flex-shrink:0;width:16px;display:flex;align-items:center;justify-content:center;color:var(--fg2);transition:transform .15s}

/* ── EDITOR ── */
.ed{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-width:0}

  overflow-x:auto;overflow-y:hidden;flex-shrink:0;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:5px;padding:0 12px;height:var(--th);
  cursor:pointer;font-size:12px;color:var(--fg2);border-right:1px solid var(--bd);
  white-space:nowrap;flex-shrink:0;transition:color .15s;position:relative;
}
.tab:hover{color:var(--fg)}
.tab.act{color:var(--fg)}
.tab.act::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--acc)}

  display:flex;align-items:center;justify-content:center;width:16px;height:16px;
  border-radius:3px;opacity:0;transition:opacity .15s;flex-shrink:0;
}
.tab:hover .tc,.tab.act .tc{opacity:1}
.tab .tc:hover{background:var(--bg-h);color:var(--fg)}
.tab.mod .tn::after{content:'●';margin-left:3px;font-size:8px;color:var(--acc);vertical-align:middle}

.edbody{flex:1;display:flex;overflow:hidden;position:relative}
.lns{

.cwrap{flex:1;overflow:auto;min-width:0}

.cwrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
.cview{

}

.ctx{

.mover{

  display:flex;align-items:center;justify-content:center;
}
.modal{
  background:var(--bg-p);border:1px solid var(--bd);border-radius:10px;
  padding:20px;min-width:300px;max-width:90vw;

.modal-t{font-size:14px;font-weight:600;margin-bottom:12px}

.modal input{
  width:100%;padding:7px 11px;background:var(--bg);border:1px solid var(--bd);
  border-radius:6px;color:var(--fg);font-size:13px;font-family:'JetBrains Mono',monospace;
  outline:none;margin-bottom:12px;
}
.modal input:focus{border-color:var(--acc)}
.modal-row{display:flex;justify-content:flex-end;gap:8px}
.mbtn{
  padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;
  border:1px solid var(--bd);background:none;color:var(--fg);font-family:inherit;
}
.mbtn:hover{background:var(--bg-h)}
.mbtn.ok{background:var(--acc);border-color:var(--acc);color:#fff}

.mbtn.danger{background:var(--red);border-color:var(--red);color:#fff}

.toast.on{opacity:1}

Run [Fooocus](https://github.com/lllyasviel/Fooocus) image generation directly in Google Colab with one click.

## Features

- One-click setup and launch via Gradio public URL
- Automatic model checkpoint downloading
- Configurable sampling parameters
- Support for SDXL models and LoRAs

## Quick Start

1. Open \`fooocus_colab.ipynb\` in Google Colab
2. Run all cells
3. Click the generated Gradio public URL

## Configuration

Edit \`config/default.json\` to change default settings:
model selection, sampling parameters, resolution presets.

## Requirements

Google Colab with GPU runtime (T4 or better).
See \`requirements.txt\` for Python dependencies.`

from __future__ import annotations

import json
from pathlib import Path
from typing import Optional

CONFIG_PATH = Path(__file__).parent.parent / 'config' / 'default.json'
MODELS_DIR  = Path(__file__).parent.parent / 'models'


def load_config(path: Optional[Path] = None) -> dict:
    """Load configuration from JSON; returns {} if the file is missing."""
    f = path or CONFIG_PATH
    if not f.exists():
        return {}

        f.name for f in p.iterdir()
        if f.suffix.lower() in {'.safetensors', '.ckpt', '.pt', '.pth'}
    )


def get_loras() -> list[str]:
    return get_checkpoints('loras')


def model_exists(name: str, subdir: str = 'checkpoints') -> bool:
    return (MODELS_DIR / subdir / name).exists()`

function node(path) {

  for (let i = 0; i < parts.length; i++) {
    if (!cur[parts[i]]) return null;
    if (i === parts.length-1) return cur[parts[i]];

}

function ext(name) { const i = name.lastIndexOf('.'); return i===-1 ? '' : name.slice(i+1).toLowerCase(); }
function lang(name) {
  return {py:'python',js:'javascript',ts:'typescript',json:'json',md:'markdown',
    txt:'plaintext',sh:'bash',yml:'yaml',yaml:'yaml',css:'css',html:'html',
    ipynb:'json',toml:'toml',cfg:'ini',ini:'ini'}[ext(name)] || 'plaintext';
}
function langLabel(l) {

  const c = {py:'var(--grn)',js:'var(--org)',ts:'var(--acc)',json:'var(--org)',md:'var(--fg2)',
    ipynb:'var(--pur)',sh:'var(--grn)',yml:'var(--red)',yaml:'var(--red)',

}

// RENDER FILE TREE

function renderTree() {
  document.getElementById('ftree').innerHTML = treeHTML(D, '', 0);
  document.querySelectorAll('.ti[data-t="f"]').forEach(el => {
    el.onclick = () => openFile(el.dataset.p);
    el.oncontextmenu = e => { e.preventDefault(); showCtx(el.dataset.p, e.clientX, e.clientY); };
    el.onkeydown = e => { if(e.key==='Enter') openFile(el.dataset.p); };
  });
  document.querySelectorAll('.ti[data-t="d"]').forEach(el => {
    el.onclick = () => toggleDir(el.dataset.p);
    el.oncontextmenu = e => { e.preventDefault(); showCtx(el.dataset.p, e.clientX, e.clientY, true); };
    el.onkeydown = e => { if(e.key==='Enter') toggleDir(el.dataset.p); };
  });
}

function treeHTML(obj, base, depth) {
  const entries = Object.entries(obj).sort(([an,av],[bn,bv]) =>
    av.t==='d' && bv.t!=='d' ? -1 : av.t!=='d' && bv.t==='d' ? 1 : an.localeCompare(bn)
  );
  let h = '';
  for (const [name, item] of entries) {
    const path = base ? `${base}/${name}` : name;
    const isDir = item.t === 'd';
    const exp = expanded.has(path);
    const act = active === path;
    const mod = modified.has(path);
    const pad = isDir ? (8 + depth*14) : (8 + depth*14 + 18);
    h += `<div class="ti${exp?' exp':''}${act?' act':''}" data-p="${path}" data-t="${item.t}" style="padding-left:${pad}px" role="button" tabindex="0">`;
    if (isDir) h += `<span class="arr"><svg width="8" height="8" viewBox="0 0 16 16" fill="currentColor"><path d="M4.646 1.646a.5.5 0 01.708 0l6 6a.5.5 0 010 .708l-6 6a.5.5 0 01-.708-.708L10.293 8 4.646 2.354a.5.5 0 010-.708z"/></svg></span>`;
    h += `<span class="ico">${fileIcon(name, item.t)}</span><span class="nm">${name}</span>`;
    if (mod) h += `<span class="dot" title="Modified"></span>`;
    h += `</div>`;
    if (isDir && exp && item.ch) {
      h += `<div class="tch">${treeHTML(item.ch, path, depth+1)}</div>`;
    }
  }
  return h;
}

function toggleDir(path) {
  expanded.has(path) ? expanded.delete(path) : expanded.add(path);
  renderTree();
}

function openFile(path) {

  activate(path);
  closeSidebar();
}

function activate(path) {

}

function closeTab(path, e) {
  if (e) e.stopPropagation();
  const i = tabs.indexOf(path);
  if (i===-1) return;
  tabs.splice(i,1);
  if (active === path) { active = tabs[Math.min(i, tabs.length-1)] || null; editing = false; }
  renderTabs(); renderEditor(); renderTree();
}

function renderTabs() {
  const bar = document.getElementById('tabs');
  bar.innerHTML = tabs.map(p => {
    const name = nameOf(p);
    const isAct = p === active, isMod = modified.has(p);
    return `<div class="tab${isAct?' act':''}${isMod?' mod':''}" data-p="${p}" role="tab">
      <span class="ico">${fileIcon(name,'f')}</span>
      <span class="tn">${name}</span>

        </svg>

// MODAL

function modal(title, msg, inputVal, placeholder, buttons) {
  const ov = document.getElementById('mover');
  const mTitle = document.getElementById('mTitle');
  const mMsg = document.getElementById('mMsg');
  const mInput = document.getElementById('mInput');
  const mRow = document.getElementById('mRow');

  mTitle.textContent = title;
  if (msg) { mMsg.textContent = msg; mMsg.hidden = false; }
  else { mMsg.hidden = true; }
  mInput.value = inputVal || '';
  mInput.placeholder = placeholder || '';
  mInput.hidden = !placeholder && inputVal === undefined;

  mRow.innerHTML = '';
  const cleanup = () => { ov.hidden = true; mInput.onkeydown = null; };
  for (const b of buttons) {
    const btn = document.createElement('button');
    btn.className = `mbtn${b.cls?' '+b.cls:''}`;
    btn.textContent = b.l;
    btn.onclick = () => { cleanup(); b.f(mInput.value.trim()); };
    mRow.appendChild(btn);
  }
  mInput.onkeydown = e => {
    if (e.key==='Enter') { cleanup(); buttons.find(b=>b.ok)?.f(mInput.value.trim()); }
    if (e.key==='Escape') { cleanup(); }
  };
  ov.hidden = false;
  if (placeholder !== undefined) setTimeout(()=>{ mInput.focus(); if(inputVal) mInput.select(); },40);
}

// ═══════════════════════════════════════════════════════
// FILE OPERATIONS
// ═══════════════════════════════════════════════════════

function parentContainer(path) {
  const p = parentOf(path);
  if (!p) return D;
  const pn = node(p);
  return pn?.ch || null;
}

function promptNew(parentPath, type) {
  const ph = type==='f' ? 'newfile.py' : 'newfolder';
  modal(`New ${type==='f'?'File':'Folder'}`, null, '', ph, [
    {l:'Cancel', f:()=>{}},
    {l:'Create', cls:'ok', ok:true, f:(name) => {
      if (!name) return;
      const pn = node(parentPath);
      if (!pn?.ch) return;
      if (pn.ch[name]) { toast('Name already exists'); return; }
      if (type==='f') {
        pn.ch[name] = {t:'f', l:lang(name), c:''};
        expanded.add(parentPath);
        renderTree();
        openFile(`${parentPath}/${name}`);
      } else {
        pn.ch[name] = {t:'d', ch:{}};
        expanded.add(parentPath);
        expanded.add(`${parentPath}/${name}`);
        renderTree();
      }
      toast(`Created "${name}"`);
    }},
  ]);
}

function promptNewRoot(type) {
  const ph = type==='f' ? 'newfile.py' : 'newfolder';
  modal(`New ${type==='f'?'File':'Folder'}`, null, '', ph, [
    {l:'Cancel', f:()=>{}},
    {l:'Create', cls:'ok', ok:true, f:(name) => {
      if (!name) return;
      if (D[name]) { toast('Name already exists'); return; }
      if (type==='f') {
        D[name] = {t:'f', l:lang(name), c:''};
        renderTree(); openFile(name);
      } else {
        D[name] = {t:'d', ch:{}}; expanded.add(name); renderTree();
      }
      toast(`Created "${name}"`);
    }},
  ]);
}

function promptRename(path) {
  const name = nameOf(path);
  modal('Rename', null, name, 'new name', [
    {l:'Cancel', f:()=>{}},
    {l:'Rename', cls:'ok', ok:true, f:(newName) => {
      if (!newName || newName===name) return;
      const container = parentContainer(path);
      if (!container) return;
      if (container[newName]) { toast('Name already exists'); return; }
      container[newName] = container[name];
      delete container[name];
      const p = parentOf(path);
      const newPath = p ? `${p}/${newName}` : newName;
      const idx = tabs.indexOf(path);
      if (idx !== -1) {
        tabs[idx] = newPath;
        if (active===path) active = newPath;
      }
      renderTree(); renderTabs(); renderEditor();
      toast(`Renamed to "${newName}"`);
    }},
  ]);
}

function confirmDelete(path) {
  const name = nameOf(path);
  modal('Delete file?', `"${name}" will be permanently removed.`, undefined, undefined, [
    {l:'Cancel', f:()=>{}},
    {l:'Delete', cls:'danger', f:() => {
      const container = parentContainer(path);
      if (!container) return;
      tabs = tabs.filter(t => t!==path && !t.startsWith(path+'/'));
      if (!tabs.includes(active)) active = tabs[tabs.length-1]||null;
      delete container[name];
      modified.delete(path);
      renderTree(); renderTabs(); renderEditor();
      toast(`"${name}" deleted`);
    }},
  ]);
}

// ═══════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════

function showSearch() {
  modal('Search in files', null, '', 'search term…', [
    {l:'Cancel', f:()=>{}},
    {l:'Search', cls:'ok', ok:true, f:(term) => {
      if (!term) return;
      const hits = [];
      function walk(obj, base) {
        for (const [name, item] of Object.entries(obj)) {
          const path = base ? `${base}/${name}` : name;
          if (item.t==='f' && item.c) {
            item.c.split('\n').forEach((line,i) => {
              if (line.toLowerCase().includes(term.toLowerCase()))
                hits.push({path, line:i+1, text:line.trim()});
            });
          } else if (item.t==='d' && item.ch) walk(item.ch, path);
        }
      }
      walk(D, '');
      if (!hits.length) { toast(`No results for "${term}"`); return; }
      openFile(hits[0].path);
      toast(`${hits.length} match${hits.length>1?'es':''} for "${term}"`);
    }},
  ]);
}

// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('on'), 2200);
}

// ═══════════════════════════════════════════════════════
// SIDEBAR (MOBILE)
// ═══════════════════════════════════════════════════════

function closeSidebar() {
  if (innerWidth > 620) return;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sbarBack').classList.remove('on');
}

document.getElementById('mobTog').onclick = () => {
  const sb = document.getElementById('sidebar');
  const bk = document.getElementById('sbarBack');
  const open = sb.classList.toggle('open');
  bk.classList.toggle('on', open);
};
document.getElementById('sbarBack').onclick = closeSidebar;

// ═══════════════════════════════════════════════════════
// WIRING
// ═══════════════════════════════════════════════════════

document.getElementById('themeTog').onclick = () => {
  const r = document.documentElement;
  const cur = r.getAttribute('data-theme');
  const next = cur==='light' ? 'dark' : cur==='dark' ? null : 'light';
  next ? r.setAttribute('data-theme',next) : r.removeAttribute('data-theme');
  try { localStorage.setItem('fc-theme', next||'system'); } catch{}
};

document.getElementById('newFile').onclick = () => promptNewRoot('f');
document.getElementById('newFolder').onclick = () => promptNewRoot('d');
document.getElementById('searchBtn').onclick = showSearch;

document.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key==='k') { e.preventDefault(); showSearch(); }
  if (e.key==='Escape') { hideCtx(); document.getElementById('mover').hidden=true; }
});

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════

renderTree();
renderTabs();
renderEditor();
openFile('README.md');
</script>
